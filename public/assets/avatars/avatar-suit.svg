<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="245" fill="#f8fafc" stroke="#e2e8f0" stroke-width="10"/>

  <g id="businessman">
    <!-- Suit Jacket / Shoulders -->
    <path d="M 70,440 
             C 85,350 140,300 200,295 
             L 215,360 
             L 250,440 
             L 285,360 
             L 300,295 
             C 360,300 415,350 430,440 
             C 380,455 320,460 250,460 
             C 180,460 120,455 70,440 Z" 
          fill="#64748b"/>

    <!-- Darker Suit Lapels -->
    <!-- Left Lapel -->
    <path d="M 160,310 L 205,375 L 245,440 L 220,440 L 175,370 L 140,335 Z" fill="#334155"/>
    <!-- Right Lapel -->
    <path d="M 340,310 L 295,375 L 255,440 L 280,440 L 325,370 L 360,335 Z" fill="#334155"/>

    <!-- White Shirt -->
    <path d="M 200,285 L 250,335 L 300,285 L 275,255 L 225,255 Z" fill="#ffffff"/>
    <path d="M 215,265 L 250,335 L 210,360 Z" fill="#f1f5f9"/>
    <path d="M 285,265 L 250,335 L 290,360 Z" fill="#f1f5f9"/>

    <!-- Cyan Tie -->
    <!-- Knot -->
    <polygon points="238,325 262,325 258,345 242,345" fill="#0097a7"/>
    <!-- Tie Body -->
    <polygon points="242,345 258,345 266,430 250,445 234,430" fill="#00bcd4"/>

    <!-- Neck -->
    <path d="M 220,220 L 220,270 C 220,285 280,285 280,270 L 280,220 Z" fill="#fbc7a6"/>
    <!-- Neck Shadow -->
    <path d="M 220,235 C 235,255 265,255 280,235 L 280,260 C 270,275 230,275 220,260 Z" fill="#e5aa85"/>

    <!-- Ears -->
    <ellipse cx="172" cy="185" rx="14" ry="24" fill="#fbd5b5"/>
    <ellipse cx="328" cy="185" rx="14" ry="24" fill="#fbd5b5"/>

    <!-- Head & Face -->
    <path d="M 250,75 
             C 190,75 180,125 180,180 
             C 180,235 205,270 250,270 
             C 295,270 320,235 320,180 
             C 320,125 310,75 250,75 Z" 
          fill="#fbd5b5"/>

    <!-- Black Sleek Hair -->
    <path d="M 250,70 
             C 190,70 172,105 172,160 
             C 172,175 178,185 182,185 
             C 185,150 195,120 220,115 
             C 240,110 270,125 295,115 
             C 315,120 322,150 325,185 
             C 328,185 332,175 332,160 
             C 332,105 310,70 250,70 Z" 
          fill="#1e293b"/>
  </g>
</svg>
