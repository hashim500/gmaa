    <!-- Pre-hydration Accessibility & Theme Sync Script -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('pdf_tools_theme');
          var isDark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var savedScale = localStorage.getItem('pdf_tools_text_scale');
          if (savedScale) {
            document.documentElement.style.fontSize = savedScale + '%';
          }

          var savedGrayscale = localStorage.getItem('pdf_tools_grayscale');
          if (savedGrayscale === 'true') {
            document.documentElement.classList.add('site-grayscale');
          }
        } catch(e) {}
      })();

        <h1>PdfDoer - أدوات PDF المجانية الشاملة (دمج، ضغط، تحويل، حماية وسيرة ذاتية CV)</h1>
        <p>مرحباً بك في منصة PdfDoer الرائدة لمعالجة ملفات ومستندات PDF مجاناً وبأمان محلي 100%. تتيح لك أدواتنا القيام بكافة المهام بدون برامج وبأمان مطلق:</p>
        <ul>
          <li><strong>دمج ملفات PDF (Merge PDF):</strong> دمج عدة وثائق وملفات في ملف واحد منظم مع التحكم في الترتيب.</li>
          <li><strong>تقسيم واستخراج الصفحات (Split PDF):</strong> فصل صفحات محددة أو استخراج نطاق صفحات من أي ملف PDF.</li>
          <li><strong>ضغط وتصغير حجم PDF (Compress PDF):</strong> تقليص حجم المستندات لتسهيل إرسالها عبر البريد الإلكتروني والواتساب.</li>
          <li><strong>تحويل PDF إلى صور (PDF to JPG/PNG):</strong> استخراج كافة الصفحات بدقة عالية جداً كصور قابلة للحفظ.</li>
          <li><strong>تحويل الصور إلى PDF (Images to PDF):</strong> تجميع الصور والمستندات المصورة في ملف PDF احترافي وموحد.</li>
          <li><strong>حماية وتشفير PDF (Protect PDF):</strong> قفل الملفات الحساسة بكلمة سر وتشفير عالي الأمان.</li>
          <li><strong>فك حماية PDF (Unlock PDF):</strong> إزالة كلمات المرور وتسهيل طباعة وتعديل المستندات المصرح لك بها.</li>
          <li><strong>إنشاء سيرة ذاتية CV:</strong> بناء سيرة ذاتية احترافية متوافقة مع أنظمة ATS بثلاثة قوالب جاهزة للتحميل.</li>
          <li><strong>مقارنة ملفات PDF (Compare PDF):</strong> فحص الفروق الدقيقة بين مسودات العقود والوثائق.</li>
          <li><strong>علامة مائية وترقيم الصفحات:</strong> ختم المستندات وحفظ الحقوق وترقيم الفهارس بسهولة.</li>
        </ul>
